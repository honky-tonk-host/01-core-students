<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Website</title>

    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/main.css" />
  </head>
  <body>
    <header>
      <h1>Register Form</h1>
    </header>

    <main>
      <form>
        <div class="form-group">
          <label for="username" class="is-required">Username:</label>
          <input type="text" id="username" name="username" required />
        </div>
        <div class="form-group">
          <label for="email" class="is-required">Email:</label>
          <input type="email" id="email" name="email" required />
        </div>
        <div class="form-group">
          <label for="password" class="is-required">Password:</label>
          <input type="password" id="password" name="password" required />
        </div>
        <div class="form-group">
          <label for="confirm-password" class="is-required"
            >Confirm Password:</label
          >
          <input
            type="password"
            id="confirm-password"
            name="confirm-password"
            required
          />
        </div>

        <div class="form-group">
          <label for="dob">Date of Birth:</label>
          <input type="date" id="dob" name="dob" />
        </div>
        <div class="form-group">
          <label class="is-required" for="gender">Gender:</label>
          <select id="gender" name="gender" required>
            <option value="">Select</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="other">Other</option>
          </select>
        </div>
        <div class="form-group">
          <label for="bio">Bio:</label>
          <textarea id="bio" name="bio" rows="4"></textarea>
        </div>
        <div class="form-group">
          <p>subscribe to our newsletter</p>
          <input type="radio" id="subscribe-yes" name="subscribe" value="yes" />
          <label for="subscribe-yes" class="inline">Yes</label>
          <input type="radio" id="subscribe-no" name="subscribe" value="no" />
          <label for="subscribe-no" class="inline">No</label>
        </div>
        <div class="form-group">
          <input type="checkbox" id="terms" name="terms" required />
          <label for="terms" class="inline is-required"
            >I agree to the terms and conditions</label
          >
        </div>
        <div class="form-group">
          <button type="submit" class="btn">Register</button>
        </div>
        <div class="form-group">
          <button type="reset" class="btn">Reset</button>
        </div>
      </form>
    </main>
  </body>
</html>
